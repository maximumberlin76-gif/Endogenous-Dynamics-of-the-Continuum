      - name: Validate Python YAML and JSON syntax
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from __future__ import annotations
          import json
          from pathlib import Path
          import yaml
          python_files=sorted(Path('.').rglob('*.py'))
          yaml_files=sorted(set(Path('.').rglob('*.yml'))|set(Path('.').rglob('*.yaml')))
          json_files=sorted(Path('.').rglob('*.json'))
          for path in python_files: compile(path.read_text(encoding='utf-8'),str(path),'exec')
          for path in yaml_files:
              with path.open('r',encoding='utf-8') as handle: yaml.safe_load(handle)
          for path in json_files:
              with path.open('r',encoding='utf-8') as handle: json.load(handle)
          print(f'Syntax PASS: {len(python_files)} Python, {len(yaml_files)} YAML, {len(json_files)} JSON files.')
          PY
