      - name: Verify archive CRC and manifest state
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from __future__ import annotations
          import tarfile,zipfile
          from pathlib import Path
          archives=[]
          for path in sorted(Path('.').rglob('*')):
              if not path.is_file() or '.git' in path.parts: continue
              if path.name.lower().endswith(('.zip','.tar','.tar.gz','.tgz','.tar.bz2','.tbz2','.tar.xz','.txz')): archives.append(path)
          for path in archives:
              if path.name.lower().endswith('.zip'):
                  with zipfile.ZipFile(path) as item:
                      bad=item.testzip()
                      if bad is not None: raise SystemExit(f'ZIP CRC failure in {path}: {bad}')
              else:
                  with tarfile.open(path,'r:*') as item:
                      for member in item.getmembers():
                          if not member.isfile(): continue
                          extracted=item.extractfile(member)
                          if extracted is None: raise SystemExit(f'Cannot read TAR member {member.name} in {path}')
                          while extracted.read(1024*1024): pass
          manifests=[p for p in Path('.').rglob('*') if p.is_file() and '.git' not in p.parts and ('sha256' in p.name.lower() or 'checksum' in p.name.lower())]
          print(f'Archive validation PASS: {len(archives)} archives; {len(manifests)} checksum-manifest candidates.')
          PY
