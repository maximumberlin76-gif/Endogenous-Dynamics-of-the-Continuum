name: Add Generalized Ramp-Scaling Lemma

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: add-generalized-ramp-scaling-lemma-${{ github.ref }}
  cancel-in-progress: false

jobs:
  add-generalized-ramp-scaling-lemma:
    name: Add and integrate generalized critical ramp-scaling lemma
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONDONTWRITEBYTECODE: "1"
      MPLBACKEND: Agg
      WORKFLOW_PATH: .github/workflows/add-generalized-ramp-scaling-lemma.yml
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install numpy matplotlib pytest pyyaml
