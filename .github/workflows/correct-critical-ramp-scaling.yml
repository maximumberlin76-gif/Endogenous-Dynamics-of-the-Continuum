name: Correct Critical Ramp Scaling

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: correct-critical-ramp-scaling-${{ github.ref }}
  cancel-in-progress: false

jobs:
  correct-critical-ramp-scaling:
    name: Correct inverse-square-root critical delay scaling
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONDONTWRITEBYTECODE: "1"
      MPLBACKEND: Agg
      WORKFLOW_PATH: .github/workflows/correct-critical-ramp-scaling.yml

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install numpy matplotlib pytest pyyaml
          python -m pip check

      - name: Verify exact source state
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from __future__ import annotations

          import hashlib
          import subprocess
          from pathlib import Path


          expected_hashes = {
              "MODULE_INDEX_EN_RU.md": "c02b1e909a9c4ad21398a6af23711b1fd741678ff3692cf663a32e8737f3eca4",
              "glossary/EDK_GLOSSARY_EN_RU.md": "6c6ef3907b6a1b545b496e96c78ffbc6b6ab0e782e8d8438dddaaccc966a38a4",
              "mathematical_formalism/appendix_black_luminous_sphere_dissipation.md": "12dccb9fdb2d64941800a7198157a988644669aab783cbee7a33477e0e990821",
              "module_edk_continuum_simulation/README.md": "b82adf36a1d406f6719b5fc6057e556e7df96d2ea972943b06e71dabacf3fbb3",
              "module_framework_core/README.md": "7314ddbd6cf807def0a5da07603d417252747716fa9feec051777834aadb50e5",
              "phase_coupling_protocol/universal_meta_protocol_EN_RU.md": "19dffc1b98715e9c331e036ebee389ea65de83d36f5e404aafbbc742e0fa9541",
              "module_edk_marnov_retention_collapse_protocol/README_EN_RU.md": "622bc9d3daac384d37aff8f1b73c3a8c022ab80f2e8a37ecc030e4b8b88d1cf3",
              "module_framework_core/framework_core.py": "cf98e031f83b12559a1ea7d974e05e5e9395188de4e351b3dfab6d3f92b15fe8",
              "module_edk_marnov_retention_collapse_protocol/marnov_retention_collapse_protocol.py": "a63cb6db84f9417be269dbaa6dc5bbe5fb4d8c0be37832f030d50c27f59f71d3",
              "module_edk_marnov_retention_collapse_protocol/test_marnov_retention_collapse_protocol.py": "28111e26ac21ab0f5f90cbfd7ca26d39e4ee0d71d023c7e5cb1df426b13f9f9e",
              "module_edk_marnov_retention_collapse_protocol/smoke_test.py": "ffe892719dcf9ac3a814b76a5b65574d4ab8b7eecc3269315046d29a382fb340",
          }

          new_test = Path("module_framework_core/test_framework_core.py")
          workflow = Path(".github/workflows/correct-critical-ramp-scaling.yml")

          status = subprocess.run(
              ["git", "status", "--porcelain=v1", "--untracked-files=all"],
              check=True,
              capture_output=True,
              text=True,
          ).stdout

          if status:
              raise SystemExit(
                  "Checkout is not clean before application:\n" + status
              )

          if not workflow.is_file():
              raise SystemExit(f"Missing workflow file: {workflow}")

          if new_test.exists():
              raise SystemExit(
                  f"New regression test already exists: {new_test}"
              )

          for relative_path, expected_hash in expected_hashes.items():
              path = Path(relative_path)

              if not path.is_file():
                  raise SystemExit(f"Missing source file: {relative_path}")

              actual_hash = hashlib.sha256(path.read_bytes()).hexdigest()

              if actual_hash != expected_hash:
                  raise SystemExit(
                      f"Source-state mismatch for {relative_path}: "
                      f"expected {expected_hash}, got {actual_hash}"
                  )

          print(
              f"Verified {len(expected_hashes)} exact source hashes; "
              "new regression-test path is absent."
          )
          PY

      - name: Verify unique anchors and apply correction atomically
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from __future__ import annotations

          import base64
          import os
          import tempfile
          from pathlib import Path


          def replace_exact(
              text: str,
              old: str,
              new: str,
              expected_count: int,
              label: str,
          ) -> str:
              actual_count = text.count(old)

              if actual_count != expected_count:
                  raise SystemExit(
                      f"{label}: expected {expected_count} source anchors, "
                      f"found {actual_count}"
                  )

              return text.replace(old, new)


          files = {
              Path("MODULE_INDEX_EN_RU.md"),
              Path("glossary/EDK_GLOSSARY_EN_RU.md"),
              Path("mathematical_formalism/appendix_black_luminous_sphere_dissipation.md"),
              Path("module_edk_continuum_simulation/README.md"),
              Path("module_framework_core/README.md"),
              Path("phase_coupling_protocol/universal_meta_protocol_EN_RU.md"),
              Path("module_edk_marnov_retention_collapse_protocol/README_EN_RU.md"),
              Path("module_framework_core/framework_core.py"),
              Path("module_edk_marnov_retention_collapse_protocol/marnov_retention_collapse_protocol.py"),
              Path("module_edk_marnov_retention_collapse_protocol/test_marnov_retention_collapse_protocol.py"),
              Path("module_edk_marnov_retention_collapse_protocol/smoke_test.py"),
          }

          texts = {
              path: path.read_text(encoding="utf-8")
              for path in files
          }

          path = Path("MODULE_INDEX_EN_RU.md")
          texts[path] = replace_exact(
              texts[path],
              "t_delay ~ v^(-1/3)",
              "t_delay ~ v^(-1/2)",
              2,
              str(path),
          )

          path = Path("glossary/EDK_GLOSSARY_EN_RU.md")
          texts[path] = replace_exact(
              texts[path],
              "t_delay ~ v^(-1/3)",
              "t_delay ~ v^(-1/2)",
              6,
              str(path),
          )
          texts[path] = replace_exact(
              texts[path],
              "t_delay ~ v^(-1/2)  \n",
              "t_delay ~ v^(-1/2)\n",
              2,
              f"{path} corrected formula trailing whitespace",
          )

          path = Path(
              "mathematical_formalism/appendix_black_luminous_sphere_dissipation.md"
          )
          texts[path] = replace_exact(
              texts[path],
              "Under the condition P >> C, the dynamics of coherence rescaling transform according to the Delay Scaling Law from Theorem 2:\n\n"
              "t_delay ~ v^(-1/3)",
              "Under the condition P >> C, the coherence-rescaling dynamics follow the critical ramp-delay scaling law for a linear ramp term:\n\n"
              "t_delay ~ v^(-1/2)",
              1,
              f"{path} EN scaling block",
          )
          texts[path] = replace_exact(
              texts[path],
              "При условии P >> C динамика рескейлинга когерентности преобразуется согласно Закону масштабирования задержки из Теоремы 2:\n\n"
              "t_delay ~ v^(-1/3)",
              "При условии P >> C динамика рескейлинга когерентности следует критическому закону рампового масштабирования задержки для линейного рампового члена:\n\n"
              "t_delay ~ v^(-1/2)",
              1,
              f"{path} RU scaling block",
          )

          path = Path("module_edk_continuum_simulation/README.md")
          texts[path] = replace_exact(
              texts[path],
              "`t_delay ~ v ^ (-1/3)`",
              "`t_delay ~ v ^ (-1/2)`",
              2,
              str(path),
          )

          path = Path("module_framework_core/README.md")
          texts[path] = replace_exact(
              texts[path],
              "`t_delay = velocity ^ (-1/3)`",
              "`t_delay = velocity ^ (-1/2)`",
              2,
              str(path),
          )

          path = Path("phase_coupling_protocol/universal_meta_protocol_EN_RU.md")
          texts[path] = replace_exact(
              texts[path],
              "t_delay ~ v^(-1/3)",
              "t_delay ~ v^(-1/2)",
              2,
              str(path),
          )

          path = Path(
              "module_edk_marnov_retention_collapse_protocol/README_EN_RU.md"
          )
          texts[path] = replace_exact(
              texts[path],
              "`tau_delay(t) = tau_0 / (v(t) + epsilon_v)^(1/3)`",
              "`tau_delay(t) = tau_0 / (v(t) + epsilon_v)^(1/2)`",
              2,
              f"{path} EN/RU delay formulas",
          )

          replacements = (
              (
                  "The protocol represents the configured inverse-cube-root delay relation through:",
                  "The protocol represents the inverse-square-root critical ramp-delay relation through:",
                  "EN delay description",
              ),
              (
                  "`tau_delay(t) is proportional to v(t)^(-1/3)`",
                  "`tau_delay(t) is proportional to v(t)^(-1/2)`",
                  "EN equivalent scaling",
              ),
              (
                  "This relation is a configurable modelling assumption of the numerical protocol.",
                  "This relation implements the temporal scaling of the linear critical ramp class used by the numerical protocol.",
                  "EN interpretation",
              ),
              (
                  "The inverse-cube-root retardation relation is implemented as a configurable modelling assumption whose consequences can be numerically compared with alternative delay laws.",
                  "The inverse-square-root retardation relation is implemented as the protocol critical ramp-delay law and is regression-tested against exponent -1/2.",
                  "EN research status",
              ),
              (
                  "Протокол представляет настроенное соотношение задержки, обратно пропорциональной кубическому корню, через:",
                  "Протокол представляет критическое рамповое соотношение задержки, обратно пропорциональной квадратному корню, через:",
                  "RU delay description",
              ),
              (
                  "`tau_delay(t) пропорционально v(t)^(-1/3)`",
                  "`tau_delay(t) пропорционально v(t)^(-1/2)`",
                  "RU equivalent scaling",
              ),
              (
                  "Это соотношение является настраиваемым модельным предположением численного протокола.",
                  "Это соотношение реализует временное масштабирование класса с линейным критическим рамповым членом, используемого численным протоколом.",
                  "RU interpretation",
              ),
              (
                  "Ретардационное соотношение обратного кубического корня реализуется как настраиваемое модельное предположение, последствия которого могут численно сравниваться с альтернативными законами задержки.",
                  "Ретардационное соотношение обратного квадратного корня реализуется как критический рамповый закон задержки протокола и регрессионно проверяется относительно показателя -1/2.",
                  "RU research status",
              ),
          )

          for old, new, label in replacements:
              texts[path] = replace_exact(
                  texts[path],
                  old,
                  new,
                  1,
                  f"{path} {label}",
              )

          path = Path("module_framework_core/framework_core.py")
          texts[path] = replace_exact(
              texts[path],
              "t_delay = velocity ** (-1.0 / 3.0)",
              "t_delay = velocity ** (-1.0 / 2.0)",
              1,
              str(path),
          )

          path = Path(
              "module_edk_marnov_retention_collapse_protocol/"
              "marnov_retention_collapse_protocol.py"
          )
          texts[path] = replace_exact(
              texts[path],
              "            ** (\n"
              "                1.0\n"
              "                / 3.0\n"
              "            )",
              "            ** (\n"
              "                1.0\n"
              "                / 2.0\n"
              "            )",
              1,
              str(path),
          )

          path = Path(
              "module_edk_marnov_retention_collapse_protocol/"
              "test_marnov_retention_collapse_protocol.py"
          )
          old_test = base64.b64decode(
              ""
          ).decode("utf-8")
          new_test = base64.b64decode(
              ""
          ).decode("utf-8")
          texts[path] = replace_exact(
              texts[path],
              old_test,
              new_test,
              1,
              str(path),
          )

          path = Path(
              "module_edk_marnov_retention_collapse_protocol/smoke_test.py"
          )
          old_smoke = base64.b64decode(
              ""
          ).decode("utf-8")
          new_smoke = base64.b64decode(
              ""
          ).decode("utf-8")
          texts[path] = replace_exact(
              texts[path],
              old_smoke,
              new_smoke,
              1,
              str(path),
          )

          new_test_path = Path("module_framework_core/test_framework_core.py")
          new_test_text = base64.b64decode(
              ""
          ).decode("utf-8")

          if new_test_path.exists():
              raise SystemExit(
                  f"Refusing to overwrite existing file: {new_test_path}"
              )

          pending = dict(texts)
          pending[new_test_path] = new_test_text
          temporary_paths: list[tuple[Path, Path]] = []

          try:
              for target, content in pending.items():
                  target.parent.mkdir(parents=True, exist_ok=True)
                  descriptor, temporary_name = tempfile.mkstemp(
                      prefix=f".{target.name}.",
                      suffix=".tmp",
                      dir=target.parent,
                      text=True,
                  )
                  temporary = Path(temporary_name)

                  with os.fdopen(descriptor, "w", encoding="utf-8", newline="") as handle:
                      handle.write(content)
                      handle.flush()
                      os.fsync(handle.fileno())

                  temporary_paths.append((temporary, target))

              for temporary, target in temporary_paths:
                  os.replace(temporary, target)

          finally:
              for temporary, _ in temporary_paths:
                  temporary.unlink(missing_ok=True)

          print(f"Applied controlled changes to {len(pending)} files.")
          PY

      - name: Verify exponent balance and obsolete-marker removal
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from __future__ import annotations

          import re
          from fractions import Fraction
          from pathlib import Path


          alpha = Fraction(1, 2)

          for n in (2, 3, 4, 5, 7, 11):
              beta = Fraction(1, 2 * (n - 1))
              derivative_exponent = beta + alpha
              ramp_exponent = 1 - alpha + beta
              saturation_exponent = n * beta

              if not (
                  derivative_exponent
                  == ramp_exponent
                  == saturation_exponent
              ):
                  raise SystemExit(
                      f"Exponent balance failed for n={n}: "
                      f"{derivative_exponent}, {ramp_exponent}, "
                      f"{saturation_exponent}"
                  )

              if alpha != Fraction(1, 2):
                  raise SystemExit("Temporal exponent alpha is not 1/2.")

              if beta != Fraction(1, 2 * (n - 1)):
                  raise SystemExit(
                      f"Amplitude exponent beta failed for n={n}."
                  )

          text_suffixes = {
              ".md",
              ".txt",
              ".tex",
              ".rst",
              ".py",
              ".json",
              ".yaml",
              ".yml",
              ".toml",
              ".csv",
              ".cff",
          }
          obsolete_patterns = (
              re.compile(
                  r"(?:t_delay|tau_delay)[^\n]{0,160}"
                  r"(?:\^|\*\*)\s*\(?\s*-?\s*1(?:\.0)?\s*/\s*3(?:\.0)?\s*\)?",
                  re.IGNORECASE,
              ),
              re.compile(r"inverse[- ]cube[- ]root", re.IGNORECASE),
              re.compile(
                  r"обрат\w*\s+(?:пропорциональ\w*\s+)?"
                  r"кубическ\w*\s+корн\w*",
                  re.IGNORECASE,
              ),
              re.compile(
                  r"t_delay\s*=\s*velocity\s*\*\*\s*"
                  r"\(\s*-\s*1\.0\s*/\s*3\.0\s*\)",
                  re.IGNORECASE,
              ),
          )

          violations: list[str] = []

          workflow_path = Path(
              ".github/workflows/correct-critical-ramp-scaling.yml"
          )

          for path in sorted(Path(".").rglob("*")):
              if not path.is_file() or ".git" in path.parts:
                  continue

              if path == workflow_path:
                  continue

              if path.suffix.lower() not in text_suffixes and path.suffix:
                  continue

              try:
                  text = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue

              for pattern in obsolete_patterns:
                  for match in pattern.finditer(text):
                      line = text.count("\n", 0, match.start()) + 1
                      violations.append(
                          f"{path}:{line}: {match.group(0)!r}"
                      )

          target_code = {
              Path("module_framework_core/framework_core.py"):
                  "t_delay = velocity ** (-1.0 / 2.0)",
              Path(
                  "module_edk_marnov_retention_collapse_protocol/"
                  "marnov_retention_collapse_protocol.py"
              ):
                  "1.0\n                / 2.0",
          }

          for path, required_marker in target_code.items():
              text = path.read_text(encoding="utf-8")

              if text.count(required_marker) != 1:
                  violations.append(
                      f"{path}: required corrected executable marker "
                      f"count is {text.count(required_marker)}, expected 1"
                  )

          if violations:
              raise SystemExit(
                  "Obsolete or inconsistent scaling markers remain:\n"
                  + "\n".join(violations)
              )

          print(
              "Exact exponent balance PASS for n=2,3,4,5,7,11; "
              "obsolete delay-scaling markers absent."
          )
          PY

      - name: Validate Python YAML and JSON syntax
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path

          import yaml


          python_files = sorted(Path(".").rglob("*.py"))
          yaml_files = sorted(
              set(Path(".").rglob("*.yml"))
              | set(Path(".").rglob("*.yaml"))
          )
          json_files = sorted(Path(".").rglob("*.json"))

          for path in python_files:
              source = path.read_text(encoding="utf-8")
              compile(source, str(path), "exec")

          for path in yaml_files:
              with path.open("r", encoding="utf-8") as handle:
                  yaml.safe_load(handle)

          for path in json_files:
              with path.open("r", encoding="utf-8") as handle:
                  json.load(handle)

          print(
              f"Syntax PASS: {len(python_files)} Python, "
              f"{len(yaml_files)} YAML, {len(json_files)} JSON files."
          )
          PY

      - name: Run full project tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q -p no:cacheprovider

      - name: Run project smoke tests
        shell: bash
        run: |
          set -euo pipefail
          python module_edk_gpu_mean_field_phase_engine/smoke_test.py
          python module_edk_hierarchical_orchestrator/smoke_test.py
          python module_edk_marnov_retention_collapse_protocol/smoke_test.py
          python module_edk_spatiotemporal_phase_delay/smoke_test.py
          python module_edk_vortex_phase_field/smoke_test.py

      - name: Verify archive CRC and manifest state
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from __future__ import annotations

          import tarfile
          import zipfile
          from pathlib import Path


          archives: list[Path] = []

          for path in sorted(Path(".").rglob("*")):
              if not path.is_file() or ".git" in path.parts:
                  continue

              lower_name = path.name.lower()

              if lower_name.endswith((".zip", ".tar", ".tar.gz", ".tgz", ".tar.bz2", ".tbz2", ".tar.xz", ".txz")):
                  archives.append(path)

          for path in archives:
              lower_name = path.name.lower()

              if lower_name.endswith(".zip"):
                  with zipfile.ZipFile(path) as archive:
                      bad_member = archive.testzip()

                      if bad_member is not None:
                          raise SystemExit(
                              f"ZIP CRC failure in {path}: {bad_member}"
                          )
              else:
                  with tarfile.open(path, "r:*") as archive:
                      for member in archive.getmembers():
                          if not member.isfile():
                              continue

                          extracted = archive.extractfile(member)

                          if extracted is None:
                              raise SystemExit(
                                  f"Cannot read TAR member {member.name} in {path}"
                              )

                          while extracted.read(1024 * 1024):
                              pass

          manifest_candidates = [
              path
              for path in Path(".").rglob("*")
              if path.is_file()
              and ".git" not in path.parts
              and (
                  "sha256" in path.name.lower()
                  or "checksum" in path.name.lower()
              )
          ]

          print(
              f"Archive validation PASS: {len(archives)} archives; "
              f"{len(manifest_candidates)} checksum-manifest candidates."
          )
          PY

      - name: Remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          test -f "${WORKFLOW_PATH}"
          rm "${WORKFLOW_PATH}"
          test ! -e "${WORKFLOW_PATH}"

      - name: Verify exact changed-file boundary and diff integrity
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from __future__ import annotations

          import subprocess


          expected_status = {
              ".github/workflows/correct-critical-ramp-scaling.yml": " D",
              "MODULE_INDEX_EN_RU.md": " M",
              "glossary/EDK_GLOSSARY_EN_RU.md": " M",
              "mathematical_formalism/appendix_black_luminous_sphere_dissipation.md": " M",
              "module_edk_continuum_simulation/README.md": " M",
              "module_edk_marnov_retention_collapse_protocol/README_EN_RU.md": " M",
              "module_edk_marnov_retention_collapse_protocol/marnov_retention_collapse_protocol.py": " M",
              "module_edk_marnov_retention_collapse_protocol/smoke_test.py": " M",
              "module_edk_marnov_retention_collapse_protocol/test_marnov_retention_collapse_protocol.py": " M",
              "module_framework_core/README.md": " M",
              "module_framework_core/framework_core.py": " M",
              "module_framework_core/test_framework_core.py": "??",
              "phase_coupling_protocol/universal_meta_protocol_EN_RU.md": " M",
          }

          output = subprocess.run(
              ["git", "status", "--porcelain=v1", "--untracked-files=all"],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.splitlines()

          actual_status: dict[str, str] = {}

          for line in output:
              status = line[:2]
              path = line[3:]

              if " -> " in path:
                  raise SystemExit(f"Unexpected rename in boundary: {line}")

              actual_status[path] = status

          if actual_status != expected_status:
              raise SystemExit(
                  "Changed-file boundary mismatch.\n"
                  f"Expected: {expected_status}\n"
                  f"Actual:   {actual_status}"
              )

          print("Exact changed-file boundary PASS.")
          PY

          git diff --check
          git diff --stat
          git diff -- . ':(exclude).github/workflows/correct-critical-ramp-scaling.yml'

      - name: Commit and push atomic correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            .github/workflows/correct-critical-ramp-scaling.yml \
            MODULE_INDEX_EN_RU.md \
            glossary/EDK_GLOSSARY_EN_RU.md \
            mathematical_formalism/appendix_black_luminous_sphere_dissipation.md \
