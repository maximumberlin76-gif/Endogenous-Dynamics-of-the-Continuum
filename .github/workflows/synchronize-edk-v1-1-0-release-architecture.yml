name: Synchronize EDK v1.1.0 Release Architecture

"on":
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: synchronize-edk-v1-1-0-release-architecture-${{ github.ref }}
  cancel-in-progress: false

jobs:
  synchronize-release-architecture:
    name: Synchronize validated modular architecture and release metadata
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: ${{ github.workspace }}
      MPLBACKEND: Agg
      WORKFLOW_PATH: .github/workflows/synchronize-edk-v1-1-0-release-architecture.yml
      STALE_WORKFLOW_PATH: .github/workflows/restore-cpow3.yml

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install numpy matplotlib pytest pyyaml
          python -m pip check

