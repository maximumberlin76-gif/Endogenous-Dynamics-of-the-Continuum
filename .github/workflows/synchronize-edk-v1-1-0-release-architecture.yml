          for script in "${SCRIPT_ROOT}"/*.sh; do
            echo "Running $(basename "$script")"
            bash "$script"
          done

      - name: Commit and push EDK v1.1.0 release synchronization
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -- \
            "${WORKFLOW_PATH}" \
            "${STALE_WORKFLOW_PATH}" \
            README.md \
            CI.md \
            CITATION.cff \
            MODULE_INDEX_EN_RU.md \
            module_organic_matrix/README_EN_RU.md \
            phase_coupling_protocol/universal_meta_protocol_EN_RU.md \
            assets/.gitkeep \
            assets/edk-hero-banner-1.png

          git diff --cached --check

          git commit \
            -m "Synchronize EDK v1.1.0 release architecture" \
            -m "Record the v1.1.0 release layer, synchronize CITATION.cff, replace obsolete repository paths and installation commands, document all 17 module directories and five CI validation layers, replace non-runnable hierarchical-orchestrator commands with validated smoke and diagnostics commands, remove the completed C^3 restoration workflow and obsolete asset placeholders, verify the exact 100-file source and 97-file target trees, validate all 21 READMEs, generalized ramp scaling, 40 Python files, 112 tests and 48 subtests, 14 module executions, five smoke tests, GPU benchmark, full stress and memory-scaling matrices, structured artifacts, deterministic replay, the exact 10-path boundary, and remove this one-time workflow."

          git push origin "HEAD:${GITHUB_REF_NAME}"
