name: Correct EDK Cascade Cubic Source

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: correct-edk-cascade-cubic-source
  cancel-in-progress: false

jobs:
  correct-cascade:
    name: Correct normalized cubic saturation and scalar source
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply controlled cascade correction
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path


          ROOT = Path(".")

          files = [
              ROOT / "mathematical_formalism/01_full_cascade_7D_to_1D_EN_RU.md",
              ROOT / "mathematical_formalism/02_stage_formulas_7D_1D_EN_RU.md",
              ROOT / "mathematical_formalism/03_closing_equations_EN_RU.md",
              ROOT / "mathematical_formalism/04_recursive_operator_phi_7D_multiplet_invariant_EN_RU.md",
              ROOT / "mathematical_formalism/05_numerical_algorithm_FDTD_EN_RU.md",
              ROOT / "mathematical_formalism/08_toroidal_operator_U6D_EN_RU.md",
              ROOT / "mathematical_formalism/09_impulse_transition_algorithm_7D_EN_RU.md",
              ROOT / "mathematical_formalism/README.md",
          ]


          for path in files:
              if not path.is_file():
                  raise SystemExit(
                      f"Missing expected file: {path}"
                  )


          def replace_exact(
              text: str,
              old: str,
              new: str,
              expected_count: int,
              label: str,
          ) -> str:

              actual_count = text.count(old)

              if actual_count != expected_count:
                  raise SystemExit(
                      f"{label}: expected "
                      f"{expected_count}, found "
                      f"{actual_count}"
                  )

              return text.replace(old, new)


          texts = {
              path: path.read_text(
                  encoding="utf-8"
              )
              for path in files
          }


          old_divergence_count = sum(
              text.count("div(C^3)")
              for text in texts.values()
          )

          if old_divergence_count != 46:
              raise SystemExit(
                  "Repository state mismatch for "
                  f"div(C^3): expected 46, "
                  f"found {old_divergence_count}"
              )


          old_normal_trace = (
              "C^3 = Tr(|Psi_coh|^2) = "
              "Tr(|U_6D Phi|^2)"
          )

          old_hat_trace = (
              "C^3 = Tr(|Psi_coh|^2) = "
              "Tr(|U_hat_6D Phi|^2)"
          )


          normal_trace_count = sum(
              text.count(old_normal_trace)
              for text in texts.values()
          )

          hat_trace_count = sum(
              text.count(old_hat_trace)
              for text in texts.values()
          )


          if normal_trace_count != 8:
              raise SystemExit(
                  "Repository state mismatch for "
                  "U_6D trace definition: "
                  f"expected 8, found "
                  f"{normal_trace_count}"
              )


          if hat_trace_count != 2:
              raise SystemExit(
                  "Repository state mismatch for "
                  "U_hat_6D trace definition: "
                  f"expected 2, found "
                  f"{hat_trace_count}"
              )


          old_toroidal_block = """C^3 =
          Tr(U_6D · |Psi_coh|^2)
          =
          integral over T^6
          Psi_coh* · U_6D · Psi_coh dT^6"""


          toroidal_path = files[5]

          if texts[toroidal_path].count(
              old_toroidal_block
          ) != 2:

              raise SystemExit(
                  "Repository state mismatch in "
                  "08_toroidal_operator_U6D_EN_RU.md"
              )


          for path, text in texts.items():
              texts[path] = text.replace(
                  "div(C^3)",
                  "C^3",
              )


          normal_new = (
              "C^3 := (1 / N_C) "
              "Tr(Psi_coh^dagger Psi_coh) = "
              "(1 / N_C) "
              "Tr((U_6D Phi)^dagger "
              "(U_6D Phi))"
          )

          hat_new = (
              "C^3 := (1 / N_C) "
              "Tr(Psi_coh^dagger Psi_coh) = "
              "(1 / N_C) "
              "Tr((U_hat_6D Phi)^dagger "
              "(U_hat_6D Phi))"
          )


          for path, text in texts.items():
              text = text.replace(
                  old_normal_trace,
                  normal_new,
              )

              text = text.replace(
                  old_hat_trace,
                  hat_new,
              )

              texts[path] = text


          texts[toroidal_path] = replace_exact(
              texts[toroidal_path],
              old_toroidal_block,
              """C^3 :=
          (1 / N_C) Tr(Psi_coh^dagger Psi_coh)
          =
          (1 / N_C) integral over T^6
          Psi_coh* · Psi_coh dT^6""",
              2,
              "Normalized toroidal definition",
          )


          cascade_path = files[0]


          texts[cascade_path] = replace_exact(
              texts[cascade_path],
              """C^3 — cubic nonlinear saturation generated by phase-coherent folding.""",
              """C^3 — cubic nonlinear saturation generated by phase-coherent folding;

          N_C > 0 — normalization factor of the folded-state intensity; equivalently, C := [(1 / N_C) Tr(Psi_coh^dagger Psi_coh)]^(1/3).""",
              1,
              "Main cascade EN normalization",
          )


          texts[cascade_path] = replace_exact(
              texts[cascade_path],
              """C^3 — кубическое нелинейное насыщение, формируемое фазово-когерентным сворачиванием.""",
              """C^3 — кубическое нелинейное насыщение, формируемое фазово-когерентным сворачиванием;

          N_C > 0 — нормировочный коэффициент интенсивности свёрнутого состояния; эквивалентно C := [(1 / N_C) Tr(Psi_coh^dagger Psi_coh)]^(1/3).""",
              1,
              "Main cascade RU normalization",
          )


          stages_path = files[1]


          texts[stages_path] = replace_exact(
              texts[stages_path],
              """C^3 — cubic nonlinear saturation;

          Tr — trace operator;

          |Psi_coh|^2 — squared modulus of the phase-coherently folded state;

          |U_6D Phi|^2 — squared modulus of the folded recursive mapping.""",
              """C^3 — cubic nonlinear saturation;

          Tr — trace operator;

          Psi_coh^dagger Psi_coh — positive-semidefinite intensity operator of the phase-coherently folded state;

          N_C > 0 — normalization factor that maps the folded-state intensity to the operational cubic-saturation scale;

          C := [(1 / N_C) Tr(Psi_coh^dagger Psi_coh)]^(1/3) — normalized coherence variable associated with C^3.""",
              1,
              "Stage formulas EN definition",
          )


          texts[stages_path] = replace_exact(
              texts[stages_path],
              """C^3 — кубическое нелинейное насыщение;

          Tr — оператор следа;

          |Psi_coh|^2 — квадрат модуля фазово-когерентно свёрнутого состояния;

          |U_6D Phi|^2 — квадрат модуля свёрнутого рекурсивного отображения.""",
              """C^3 — кубическое нелинейное насыщение;

          Tr — оператор следа;

          Psi_coh^dagger Psi_coh — положительно полуопределённый оператор интенсивности фазово-когерентно свёрнутого состояния;

          N_C > 0 — нормировочный коэффициент, отображающий интенсивность свёрнутого состояния в операционную шкалу кубического насыщения;

          C := [(1 / N_C) Tr(Psi_coh^dagger Psi_coh)]^(1/3) — нормированная переменная когерентности, связанная с C^3.""",
              1,
              "Stage formulas RU definition",
          )


          texts[stages_path] = replace_exact(
              texts[stages_path],
              """C^3 — divergence of cubic nonlinear saturation acting as the source of the resonance-window geometry.""",
              """C^3 — scalar cubic nonlinear saturation acting as the source of the resonance-window geometry.""",
              1,
              "Stage formulas EN source",
          )


          texts[stages_path] = replace_exact(
              texts[stages_path],
              """C^3 — дивергенция кубического нелинейного насыщения, выступающая источником геометрии резонансного окна.""",
              """C^3 — скалярное кубическое нелинейное насыщение, выступающее источником геометрии резонансного окна.""",
              1,
              "Stage formulas RU source",
          )


          closing_path = files[2]


          texts[closing_path] = replace_exact(
              texts[closing_path],
              """C^3 — divergence of cubic nonlinear saturation acting as the source of the resonance-window geometry.""",
              """C^3 — scalar cubic nonlinear saturation acting as the source of the resonance-window geometry.""",
              1,
              "Closing equations EN source",
          )


          texts[closing_path] = replace_exact(
              texts[closing_path],
              """C^3 — дивергенция кубического нелинейного насыщения, выступающая источником геометрии резонансного окна.""",
              """C^3 — скалярное кубическое нелинейное насыщение, выступающее источником геометрии резонансного окна.""",
              1,
              "Closing equations RU source",
          )


          texts[closing_path] = replace_exact(
              texts[closing_path],
              (
                  "The full formal closure is:\n\n"
                  + normal_new
                  + "\n\ngrad^2 Omega - "
                  "(1 / c^2) partial^2 Omega / "
                  "partial t^2 = chi C^3"
              ),
              (
                  "The full formal closure is:\n\n"
                  + normal_new
                  + "\n\nN_C > 0 is the "
                  "normalization factor of the "
                  "folded-state intensity, and "
                  "C := [(1 / N_C) "
                  "Tr(Psi_coh^dagger Psi_coh)]"
                  "^(1/3).\n\n"
                  "grad^2 Omega - "
                  "(1 / c^2) partial^2 Omega / "
                  "partial t^2 = chi C^3"
              ),
              1,
              "Closing equations EN normalization",
          )


          texts[closing_path] = replace_exact(
              texts[closing_path],
              (
                  "Полное формальное замыкание:\n\n"
                  + normal_new
                  + "\n\ngrad^2 Omega - "
                  "(1 / c^2) partial^2 Omega / "
                  "partial t^2 = chi C^3"
              ),
              (
                  "Полное формальное замыкание:\n\n"
                  + normal_new
                  + "\n\nN_C > 0 — нормировочный "
                  "коэффициент интенсивности "
                  "свёрнутого состояния, а "
                  "C := [(1 / N_C) "
                  "Tr(Psi_coh^dagger Psi_coh)]"
                  "^(1/3).\n\n"
                  "grad^2 Omega - "
                  "(1 / c^2) partial^2 Omega / "
                  "partial t^2 = chi C^3"
              ),
              1,
              "Closing equations RU normalization",
          )


          fdtd_path = files[4]


          fdtd_replacements = [
              (
                  "C^3 — divergence of cubic nonlinear saturation acting as the source of the resonance-window geometry.",
                  "C^3 — scalar cubic nonlinear saturation acting as the source of the resonance-window geometry.",
                  1,
                  "FDTD EN source definition",
              ),
              (
                  "[C^3]_i,j,k^t — discrete divergence of cubic nonlinear saturation at the grid point i, j, k and time step t.",
                  "[C^3]_i,j,k^t — discrete scalar value of cubic nonlinear saturation at the grid point i, j, k and time step t.",
                  1,
                  "FDTD EN discrete source",
              ),
              (
                  "4. Compute the discrete divergence [C^3]_i,j,k^t.",
                  "4. Compute or import the discrete scalar source [C^3]_i,j,k^t.",
                  1,
                  "FDTD EN algorithm step",
              ),
              (
                  "C^3 → C^3\n\nC^3 → Omega(t)",
                  "Psi_coh → C^3\n\nC^3 → Omega(t)",
                  2,
                  "FDTD EN/RU implementation chain",
              ),
              (
                  "C^3 — дивергенция кубического нелинейного насыщения, выступающая источником геометрии резонансного окна.",
                  "C^3 — скалярное кубическое нелинейное насыщение, выступающее источником геометрии резонансного окна.",
                  1,
                  "FDTD RU source definition",
              ),
              (
                  "[C^3]_i,j,k^t — дискретная дивергенция кубического нелинейного насыщения в узле сетки i, j, k и на временном шаге t.",
                  "[C^3]_i,j,k^t — дискретное скалярное значение кубического нелинейного насыщения в узле сетки i, j, k и на временном шаге t.",
                  1,
                  "FDTD RU discrete source",
              ),
              (
                  "4. Вычислить дискретную дивергенцию [C^3]_i,j,k^t.",
                  "4. Вычислить или импортировать дискретный скалярный источник [C^3]_i,j,k^t.",
                  1,
                  "FDTD RU algorithm step",
              ),
          ]


          for (
              old,
              new,
              count,
              label,
          ) in fdtd_replacements:

              texts[fdtd_path] = replace_exact(
                  texts[fdtd_path],
                  old,
                  new,
                  count,
                  label,
              )


          texts[toroidal_path] = replace_exact(
              texts[toroidal_path],
              """(1 / N_C) integral over T^6
          Psi_coh* · Psi_coh dT^6

          Due to the cyclic structure of U_6D""",
              """(1 / N_C) integral over T^6
          Psi_coh* · Psi_coh dT^6

          Where N_C > 0 is the normalization factor of the folded-state intensity and C := [(1 / N_C) Tr(Psi_coh^dagger Psi_coh)]^(1/3).

          Due to the cyclic structure of U_6D""",
              1,
              "Toroidal operator EN normalization",
          )


          texts[toroidal_path] = replace_exact(
              texts[toroidal_path],
              """(1 / N_C) integral over T^6
          Psi_coh* · Psi_coh dT^6

          Из-за циклической структуры U_6D""",
              """(1 / N_C) integral over T^6
          Psi_coh* · Psi_coh dT^6

          Где N_C > 0 — нормировочный коэффициент интенсивности свёрнутого состояния, а C := [(1 / N_C) Tr(Psi_coh^dagger Psi_coh)]^(1/3).

          Из-за циклической структуры U_6D""",
              1,
              "Toroidal operator RU normalization",
          )


          impulse_path = files[6]


          texts[impulse_path] = replace_exact(
              texts[impulse_path],
              (
                  hat_new
                  + "\n\n## EN — Stage 3"
              ),
              (
                  hat_new
                  + "\n\nHere N_C > 0 "
                  "normalizes the folded-state "
                  "intensity and the equation "
                  "defines the cubic saturation "
                  "through C := [(1 / N_C) "
                  "Tr(Psi_coh^dagger Psi_coh)]"
                  "^(1/3).\n\n"
                  "## EN — Stage 3"
              ),
              1,
              "Impulse algorithm EN normalization",
          )


          texts[impulse_path] = replace_exact(
              texts[impulse_path],
              (
                  hat_new
                  + "\n\n## RU — Этап 3"
              ),
              (
                  hat_new
                  + "\n\nЗдесь N_C > 0 "
                  "нормирует интенсивность "
                  "свёрнутого состояния, а "
                  "уравнение определяет "
                  "кубическое насыщение через "
                  "C := [(1 / N_C) "
                  "Tr(Psi_coh^dagger Psi_coh)]"
                  "^(1/3).\n\n"
                  "## RU — Этап 3"
              ),
              1,
              "Impulse algorithm RU normalization",
          )


          for path, text in texts.items():
              path.write_text(
                  text,
                  encoding="utf-8",
              )


          all_text = "\n".join(
              path.read_text(
                  encoding="utf-8"
              )
              for path in files
          )


          stale_tokens = [
              "div(C^3)",
              "C^3 = Tr(|Psi_coh|^2)",
              "Tr(U_6D · |Psi_coh|^2)",
              "discrete divergence of cubic nonlinear saturation",
              "дискретная дивергенция кубического нелинейного насыщения",
          ]


          for token in stale_tokens:
              if token in all_text:
                  raise SystemExit(
                      f"Stale formalism remains: {token}"
                  )


          if all_text.count(normal_new) != 8:
              raise SystemExit(
                  "Normalized U_6D definition "
                  "count mismatch"
              )


          if all_text.count(hat_new) != 2:
              raise SystemExit(
                  "Normalized U_hat_6D definition "
                  "count mismatch"
              )


          scalar_equation = (
              "grad^2 Omega - "
              "(1 / c^2) partial^2 Omega / "
              "partial t^2 = chi C^3"
          )

          nabla_equation = (
              "nabla^2 Omega - "
              "(1 / c^2) partial^2 Omega / "
              "partial t^2 = chi C^3"
          )


          if all_text.count(
              scalar_equation
          ) != 12:

              raise SystemExit(
                  "Scalar grad^2 source equation "
                  "count mismatch"
              )


          if all_text.count(
              nabla_equation
          ) != 4:

              raise SystemExit(
                  "Scalar nabla^2 source equation "
                  "count mismatch"
              )


          if all_text.count(
              "[C^3]_i,j,k^t"
          ) != 12:

              raise SystemExit(
                  "Discrete scalar source count "
                  "mismatch"
              )


          if all_text.count(
              "N_C > 0"
          ) < 10:

              raise SystemExit(
                  "Normalization definitions "
                  "are incomplete"
              )


          print(
              "EDK cascade correction "
              "completed and verified."
          )
          PY

      - name: Verify changed file boundary
        shell: bash
        run: |
          python <<'PY'
          import subprocess


          expected = {
              "mathematical_formalism/01_full_cascade_7D_to_1D_EN_RU.md",
              "mathematical_formalism/02_stage_formulas_7D_1D_EN_RU.md",
              "mathematical_formalism/03_closing_equations_EN_RU.md",
              "mathematical_formalism/04_recursive_operator_phi_7D_multiplet_invariant_EN_RU.md",
              "mathematical_formalism/05_numerical_algorithm_FDTD_EN_RU.md",
              "mathematical_formalism/08_toroidal_operator_U6D_EN_RU.md",
              "mathematical_formalism/09_impulse_transition_algorithm_7D_EN_RU.md",
              "mathematical_formalism/README.md",
          }


          result = subprocess.run(
              [
                  "git",
                  "diff",
                  "--name-only",
              ],
              check=True,
              capture_output=True,
              text=True,
          )


          changed = {
              line.strip()
              for line in result.stdout.splitlines()
              if line.strip()
          }


          if changed != expected:
              raise SystemExit(
                  "Unexpected changed-file set.\n"
                  f"Expected: {sorted(expected)}\n"
                  f"Actual:   {sorted(changed)}"
              )


          print(
              "Changed-file boundary verified:"
          )

          for path in sorted(changed):
              print(f"- {path}")
          PY

      - name: Show correction diff
        shell: bash
        run: |
          git diff --stat

          git diff -- \
            mathematical_formalism/01_full_cascade_7D_to_1D_EN_RU.md \
            mathematical_formalism/02_stage_formulas_7D_1D_EN_RU.md \
            mathematical_formalism/03_closing_equations_EN_RU.md \
            mathematical_formalism/04_recursive_operator_phi_7D_multiplet_invariant_EN_RU.md \
            mathematical_formalism/05_numerical_algorithm_FDTD_EN_RU.md \
            mathematical_formalism/08_toroidal_operator_U6D_EN_RU.md \
            mathematical_formalism/09_impulse_transition_algorithm_7D_EN_RU.md \
            mathematical_formalism/README.md

      - name: Commit correction
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 1
          fi

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            mathematical_formalism/01_full_cascade_7D_to_1D_EN_RU.md \
            mathematical_formalism/02_stage_formulas_7D_1D_EN_RU.md \
            mathematical_formalism/03_closing_equations_EN_RU.md \
            mathematical_formalism/04_recursive_operator_phi_7D_multiplet_invariant_EN_RU.md \
            mathematical_formalism/05_numerical_algorithm_FDTD_EN_RU.md \
            mathematical_formalism/08_toroidal_operator_U6D_EN_RU.md \
            mathematical_formalism/09_impulse_transition_algorithm_7D_EN_RU.md \
            mathematical_formalism/README.md

          git commit \
            -m "Correct normalized cubic saturation and scalar source across EDK cascade"

          git push \
            origin \
            "HEAD:${GITHUB_REF_NAME}"
